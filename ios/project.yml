name: BasicArt
options:
  bundleIdPrefix: com.halworks
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  BasicArt:
    type: application
    platform: iOS
    sources:
      - path: BasicArt
      - path: ../shared/fonts
        type: folder
        buildPhase: resources
      - path: ../shared/palettes/palettes.json
        buildPhase: resources
      - path: ../shared/presets/text-presets.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halworks.basicart
        PRODUCT_NAME: BasicArt
        INFOPLIST_FILE: BasicArt/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
  BasicArtTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BasicArtTests
      - path: ../shared/fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: BasicArt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halworks.basicart.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BasicArt.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/BasicArt"
        BUNDLE_LOADER: "$(TEST_HOST)"
  BasicArtUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: BasicArtUITests
    dependencies:
      - target: BasicArt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.halworks.basicart.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BasicArt
schemes:
  BasicArt:
    build:
      targets:
        BasicArt: all
        BasicArtTests: [test]
        BasicArtUITests: [test]
    test:
      targets:
        - BasicArtTests
        - BasicArtUITests
      gatherCoverageData: false
